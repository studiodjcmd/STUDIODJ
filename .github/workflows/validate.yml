name: Validate baseline and skin
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/validate_mapping.py
      - run: node --check controller/baseline/Numark-NS6-Original.js
      - run: node --test tests/mapping.test.cjs
      - run: python tests/validate_skin.py
      - run: node --check controller/studio/Studio-NS6-UI.js
      - run: node --test tests/studio_overlay.test.cjs
      - run: python tests/validate_bundle.py
  native-smoke:
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Mixxx from official stable PPA
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:mixxx/mixxx
          sudo apt-get update
          version=$(apt-cache madison mixxx | awk '$3 ~ /(^|:)2[.]5[.]6([+~.-]|$)/ {print $3; exit}')
          test -n "$version"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y "mixxx=$version" xvfb xdotool imagemagick libgl1-mesa-dri jackd2 dbus-x11
          dpkg-query -W mixxx
      - name: Load actual native skin
        run: xvfb-run -a -s "-screen 0 1366x768x24 +extension GLX" dbus-run-session -- bash tests/smoke_mixxx.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-results
          path: smoke-results/
  candidate:
    needs: [static, native-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python tools/build_alpha.py --out dist/bundle --zip dist/StudioDJ-alpha.zip
      - uses: actions/upload-artifact@v4
        with:
          name: StudioDJ-alpha
          path: dist/StudioDJ-alpha.zip
